name: Blitz validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3 (standard)
        run: |
          curl -sSL -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.6.3-stable_linux.x86_64" >> $GITHUB_ENV
      - name: Install GdUnit4 6.2.1
        run: |
          curl -sSL -o "$RUNNER_TEMP/gdunit.zip" https://github.com/godot-gdunit-labs/gdUnit4/archive/refs/tags/v6.2.1.zip
          unzip -q "$RUNNER_TEMP/gdunit.zip" -d "$RUNNER_TEMP"
          mkdir -p addons && cp -r "$RUNNER_TEMP/gdUnit4-6.2.1/addons/gdUnit4" addons/
      - name: Import
        run: $GODOT --headless --import || true
      - name: Unit, determinism and network tests
        run: $GODOT --headless -s addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a tests/
      - name: Headless AI match
        run: $GODOT --headless -s tools/sim_runner.gd -- --seed=42 --minutes=5 --report=0 | tee sim.log && grep RESULT sim.log
